openapi: 3.1.0
info:
  title: MC Plan Core API
  version: 0.1.0-alpha.2
  description: >-
    Public business identity, profile, developer application, personal access
    token, entitlement, and credit surface. Keycloak remains the credential and
    OIDC provider; personal access tokens are an alternative bearer credential
    for automation and never exceed their creator's scopes.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: https://core-api.example.invalid
tags:
  - name: Profile
    description: MC Plan business user and public creator profile operations.
  - name: Developer Apps
    description: User-registered OAuth/OIDC client applications and their approved scopes.
  - name: Personal Access Tokens
    description: Scope-limited, revocable, expiring automation tokens; only hashes are stored.
  - name: Entitlements
    description: Daily and campaign-based module entitlement operations.
  - name: Credits
    description: Audited global credit ledger consumption operations.
security:
  - userOAuth: []
paths:
  /v1/me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      summary: Return the current MC Plan public profile
      description: >-
        Resolves the verified OIDC identity or a valid personal access token to
        a stable MC Plan user and returns only its public actor fields.
        Identity-provider claims and business account security state are never
        exposed.
      x-mc-plan-stability: locked
      security:
        - userOAuth: [profile:read]
        - personalAccessToken: [profile:read]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: ../schemas/common/actor.json
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Profile]
      operationId: getPublicUser
      summary: Return a public creator profile
      security: []
      responses:
        "200":
          description: Public user
          content:
            application/json:
              schema:
                $ref: ../schemas/common/actor.json
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/developer-apps:
    post:
      tags: [Developer Apps]
      operationId: createDeveloperApp
      summary: Register a developer application for the current user
      description: >-
        Registers an OAuth/OIDC client application owned by the current user.
        Confidential clients receive a generated client secret exactly once in
        the create response; only its hash is stored. Redirect URIs must match
        exactly and use HTTPS, except explicit loopback development addresses.
        Requires the developer or admin business role.
      x-mc-plan-stability: prerelease
      security:
        - userOAuth: [developer-apps:manage]
        - personalAccessToken: [developer-apps:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeveloperAppRequest"
      responses:
        "201":
          description: Developer application created
          content:
            application/json:
              schema:
                $ref: ../schemas/core/developer-app-created.json
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        default:
          $ref: "#/components/responses/Problem"
    get:
      tags: [Developer Apps]
      operationId: listDeveloperApps
      summary: List the current user's developer applications
      x-mc-plan-stability: prerelease
      security:
        - userOAuth: [developer-apps:read]
        - personalAccessToken: [developer-apps:read]
      responses:
        "200":
          description: Developer applications owned by the current user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../schemas/core/developer-app.json
                additionalProperties: false
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        default:
          $ref: "#/components/responses/Problem"
  /v1/developer-apps/{appId}:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      tags: [Developer Apps]
      operationId: getDeveloperApp
      summary: Return one of the current user's developer applications
      x-mc-plan-stability: prerelease
      security:
        - userOAuth: [developer-apps:read]
        - personalAccessToken: [developer-apps:read]
      responses:
        "200":
          description: Developer application
          content:
            application/json:
              schema:
                $ref: ../schemas/core/developer-app.json
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Developer Apps]
      operationId: approveDeveloperAppScopes
      summary: Approve or narrow a developer application's scopes
      description: >-
        Replaces the approved scope set of an owned application. Widening stays
        within the caller's current scopes and requires the developer or admin
        business role. Requires the developer or admin business role.
      x-mc-plan-stability: prerelease
      security:
        - userOAuth: [developer-apps:manage]
        - personalAccessToken: [developer-apps:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveDeveloperAppScopesRequest"
      responses:
        "200":
          description: Updated developer application
          content:
            application/json:
              schema:
                $ref: ../schemas/core/developer-app.json
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Developer Apps]
      operationId: revokeDeveloperApp
      summary: Revoke a developer application
      description: >-
        Marks an owned application revoked. The application keeps its audit
        history. Requires the developer or admin business role.
      x-mc-plan-stability: prerelease
      security:
        - userOAuth: [developer-apps:manage]
        - personalAccessToken: [developer-apps:manage]
      responses:
        "200":
          description: Revoked developer application
          content:
            application/json:
              schema:
                $ref: ../schemas/core/developer-app.json
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/personal-access-tokens:
    post:
      tags: [Personal Access Tokens]
      operationId: createPersonalAccessToken
      summary: Issue a personal access token for the current user
      description: >-
        Issues a scope-limited personal access token. Requested scopes must be
        a subset of the caller's current scopes, and validity never exceeds the
        decided 30-day default maximum. The plaintext token is returned exactly
        once; only a keyed hash and a short prefix are stored. Creating tokens
        always requires an OIDC user token and the developer or admin business
        role, so tokens cannot mint further tokens.
      x-mc-plan-stability: prerelease
      security:
        - userOAuth: [pat:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalAccessTokenRequest"
      responses:
        "201":
          description: Personal access token created
          content:
            application/json:
              schema:
                $ref: ../schemas/core/personal-access-token-created.json
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        default:
          $ref: "#/components/responses/Problem"
    get:
      tags: [Personal Access Tokens]
      operationId: listPersonalAccessTokens
      summary: List the current user's personal access token metadata
      description: >-
        Returns metadata only. Plaintext token values and stored hashes are
        never returned.
      x-mc-plan-stability: prerelease
      security:
        - userOAuth: [pat:read]
        - personalAccessToken: [pat:read]
      responses:
        "200":
          description: Personal access token metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../schemas/core/personal-access-token.json
                additionalProperties: false
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        default:
          $ref: "#/components/responses/Problem"
  /v1/personal-access-tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [Personal Access Tokens]
      operationId: revokePersonalAccessToken
      summary: Revoke a personal access token
      description: >-
        Marks an owned token revoked. The token stops authenticating
        immediately. Requires the developer or admin business role.
      x-mc-plan-stability: prerelease
      security:
        - userOAuth: [pat:manage]
        - personalAccessToken: [pat:manage]
      responses:
        "200":
          description: Revoked personal access token metadata
          content:
            application/json:
              schema:
                $ref: ../schemas/core/personal-access-token.json
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/entitlements:
    get:
      tags: [Entitlements]
      operationId: listCurrentEntitlements
      summary: Return the current user's active daily entitlements
      security:
        - userOAuth: [credits:read]
      responses:
        "200":
          description: Active entitlements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../schemas/core/entitlement.json
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/credits/consume:
    post:
      tags: [Credits]
      operationId: consumeCredits
      summary: Consume credits or an entitlement for an authorized module operation
      security:
        - serviceOAuth: [credits:consume]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, module, operation, units, reference_id]
              properties:
                user_id:
                  type: string
                  minLength: 1
                module:
                  type: string
                  enum: [skin]
                operation:
                  type: string
                  enum: [creation_session]
                units:
                  type: integer
                  minimum: 1
                reference_id:
                  type: string
                  minLength: 1
              additionalProperties: false
      responses:
        "200":
          description: Existing idempotent consumption result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionResult"
        "201":
          description: Credits or entitlement consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionResult"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  schemas:
    ConsumptionResult:
      type: object
      required: [consumption_id, source, units, remaining, created_at]
      properties:
        consumption_id:
          type: string
        source:
          type: string
          enum: [daily_entitlement, credits]
        units:
          type: integer
          minimum: 1
        remaining:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    CreateDeveloperAppRequest:
      type: object
      required: [name, client_type, redirect_uris, approved_scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        client_type:
          type: string
          enum: [public, confidential]
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            format: uri
            minLength: 1
            maxLength: 2048
        approved_scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
      additionalProperties: false
    ApproveDeveloperAppScopesRequest:
      type: object
      required: [approved_scopes]
      properties:
        approved_scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
      additionalProperties: false
    CreatePersonalAccessTokenRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              [profile:read, credits:read, developer-apps:read, developer-apps:manage, pat:read, pat:manage]
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
          description: >-
            Token validity in days. The decided default maximum is 30 days
            (Foundation Q-007); requests above the maximum are rejected.
        developer_app_id:
          type: [string, "null"]
          description: Optional owning developer application for grouped revocation.
      additionalProperties: false
  responses:
    AuthenticationRequired:
      description: >-
        Authentication is missing or the credential fails signature, issuer,
        audience, expiry, verified-email, or personal-access-token validation.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/common/problem.json
          example:
            type: /problems/authentication-required
            title: Authentication required
            status: 401
            code: AUTHENTICATION_REQUIRED
            trace_id: 01HZZZZZZZZZZZZZZZZZZZZZZZ
    AccessForbidden:
      description: >-
        The credential lacks the required scope, the MC Plan business account
        cannot access this operation, or the caller's business role is not
        allowed. Account state is not disclosed.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/common/problem.json
          examples:
            insufficientScope:
              value:
                type: /problems/insufficient-scope
                title: Insufficient scope
                status: 403
                code: INSUFFICIENT_SCOPE
                trace_id: 01HZZZZZZZZZZZZZZZZZZZZZZZ
            accountUnavailable:
              value:
                type: /problems/account-unavailable
                title: Account unavailable
                status: 403
                code: ACCOUNT_UNAVAILABLE
                trace_id: 01HZZZZZZZZZZZZZZZZZZZZZZZ
            roleRequired:
              value:
                type: /problems/role-required
                title: Role required
                status: 403
                code: ROLE_REQUIRED
                trace_id: 01HZZZZZZZZZZZZZZZZZZZZZZZ
    ValidationFailed:
      description: The request body or parameters failed validation.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/common/problem.json
          example:
            type: /problems/validation-failed
            title: Validation failed
            status: 400
            code: VALIDATION_FAILED
            trace_id: 01HZZZZZZZZZZZZZZZZZZZZZZZ
            errors:
              - field: redirect_uris
                code: INVALID_REDIRECT_URI
                message: Redirect URIs must be exact-match HTTPS or loopback development addresses.
    NotFound:
      description: The referenced resource does not exist or is not owned by the caller.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/common/problem.json
          example:
            type: /problems/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
            trace_id: 01HZZZZZZZZZZZZZZZZZZZZZZZ
    Problem:
      description: Error response
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/common/problem.json
  securitySchemes:
    userOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.invalid/authorize
          tokenUrl: https://identity.example.invalid/token
          scopes:
            profile:read: Read the current user's MC Plan profile
            credits:read: Read the current user's entitlements and credit balance
            developer-apps:read: Read the current user's developer applications and approved scopes
            developer-apps:manage: Create, update, approve scopes for, or revoke the current user's developer applications
            pat:read: Read the current user's personal access token metadata
            pat:manage: Create or revoke the current user's personal access tokens
    personalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: mc-plan-pat
      description: >-
        Personal access token issued by Core for automation. Scopes are granted
        at creation, never exceed the creator's current scopes, and are enforced
        the same way as OIDC scopes. Creating a new token always requires an
        OIDC user token.
    serviceOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.example.invalid/token
          scopes:
            credits:consume: Consume credits for an authorized module operation
